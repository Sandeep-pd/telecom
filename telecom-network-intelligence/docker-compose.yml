services:
  db:
    image: postgres:15-alpine
    container_name: telecom-db
    environment:
      POSTGRES_DB: telecom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: telecom-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/telecom_db
      POSTGRES_DB: telecom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_ENV: development
      REQUIRE_AUTH: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
